# Reverse-proxy unifié OPTIONNEL (non branché dans docker-compose.yml par
# défaut : le frontend appelle directement api-gateway via VITE_GATEWAY_URL).
# Utile si vous voulez exposer toute la plateforme derrière un seul host:port.
events {}

http {
	server {
		listen 80;

		location /api/ {
			proxy_pass http://api-gateway:8080/api/;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		}

		location /socket.io/ {
			proxy_pass http://notifications-service:8085/socket.io/;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
		}

		location / {
			proxy_pass http://frontend:3000/;
			proxy_set_header Host $host;
		}
	}
}
