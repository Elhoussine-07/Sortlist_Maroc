spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: false
        cors-configurations:
          '[/**]':
            allowed-origins:
              - "http://localhost:3000"
            allowed-methods:
              - "GET"
              - "POST"
              - "PUT"
              - "PATCH"
              - "DELETE"
              - "OPTIONS"
            allowed-headers:
              - "Authorization"
              - "Content-Type"
              - "Accept"
              - "X-User-Email"
              - "X-User-Type"
              - "X-Agency-Id"
              - "X-Internal-Token"
            exposed-headers:
              - "Authorization"
            allow-credentials: true
            max-age: 3600
      httpclient:
        connect-timeout: 5000
        response-timeout: 30s

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:dev-insecure-secret-change-me}

internal:
  service-token: ${INTERNAL_SERVICE_TOKEN:dev-insecure-internal-token}

rate-limit:
  max-requests: ${RATE_LIMIT_MAX_REQUESTS:100}
  window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}

frontend:
  url: ${FRONTEND_URL:http://localhost:3000}

services:
  frappe-url: ${FRAPPE_URL:}
  frappe-url-container: ${FRAPPE_URL_CONTAINER:http://frappe:8000}
  frappe-url-local: ${FRAPPE_URL_LOCAL:http://host.docker.internal:8000}
  matching-url: ${MATCHING_URL:http://matching-service:8081}
  ia-url: ${IA_URL:http://ia-service:8083}
  prospection-url: ${PROSPECTION_URL:http://prospection-service:8084}
  notifications-url: ${NOTIFICATIONS_URL:http://notifications-service:8085}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.platform.gateway: INFO
