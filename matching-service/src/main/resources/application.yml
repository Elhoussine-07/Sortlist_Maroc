server:
  port: 8081

spring:
  application:
    name: matching-service
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      fail-on-unknown-properties: false

frappe:
  url: ${FRAPPE_URL:}
  url-container: ${FRAPPE_URL_CONTAINER:http://frappe:8000}
  url-local: ${FRAPPE_URL_LOCAL:http://host.docker.internal:8000}
  internal-token: ${INTERNAL_SERVICE_TOKEN:dev-insecure-internal-token}

matching:
  shortlist-size: ${MATCHING_SHORTLIST_SIZE:10}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.platform.matching: INFO
